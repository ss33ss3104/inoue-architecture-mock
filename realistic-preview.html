<!doctype html>
<html lang="ja"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>箱舟 — Material study</title><meta name="theme-color" content="#e9e7df">
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e7df;font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN",sans-serif;color:#eeeae0}#spatial-stage{position:relative;width:100%;height:100svh;overflow:hidden}canvas{display:block;width:100%;height:100%}header{position:absolute;top:25px;left:4%;right:4%;display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:.06em;text-shadow:0 1px 9px #161a16}header span{font-size:7px}a{color:inherit;text-decoration:none}.controls{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);display:flex;gap:3px;background:#eeede6ef;color:#293229;padding:5px;border-radius:30px;box-shadow:0 5px 30px #17211733;backdrop-filter:blur(12px);white-space:nowrap}button{font:inherit;font-size:10px;border:0;background:none;color:inherit;padding:14px 19px;min-height:44px;border-radius:25px;cursor:pointer}button[aria-pressed="true"]{background:#2d3c2e;color:#f0ede4}button:focus-visible,a:focus-visible{outline:2px solid #bdba91;outline-offset:3px}#load-status{position:absolute;bottom:13px;left:4%;font-size:7px;text-shadow:0 1px 9px #161a16}.fallback{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.no-3d .fallback{display:block}.no-3d canvas{opacity:0}.no-3d .controls{display:none}.loading{position:absolute;inset:0;display:grid;place-items:center;color:#2d3c2e;font-size:12px;letter-spacing:.06em;background:#e9e7df}body.ready .loading{display:none}body:not(.ready) .controls{visibility:hidden}@media(max-width:760px){header{top:22px;left:6%;right:6%;font-size:8px}header span{font-size:6px}button{font-size:9px;padding:12px 13px}.controls{bottom:48px;max-width:96vw;gap:0}#load-status{bottom:23px;left:6%;font-size:6px}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.min.js","three/addons/":"./vendor/three/addons/"}}</script>
</head><body><main id="spatial-stage"><canvas id="scene" aria-label="質感を改善した箱舟の3Dモデル"></canvas><img class="fallback" src="hybrid/assets/hakobune-exterior.jpg" alt="箱舟の外観写真"><div class="loading" role="status">空間を準備しています…</div><header><div>HAKOBUNE <span>/ MATERIAL STUDY</span></div><a href="hybrid/">Website ↗</a></header><div class="controls" aria-label="3Dの操作"><button data-view=".34" aria-pressed="false">外観</button><button data-view=".55" aria-pressed="false">屋根を開く</button><button data-view=".77" aria-pressed="true">室内</button><button id="free" aria-pressed="false">自由に眺める</button><button id="night" aria-pressed="false">夕景</button></div><span id="load-status">BLENDER / PHOTOGRAPHIC PBR STUDY</span></main>
<script type="module">
import {createSpatialExperience} from './hybrid/spatial.js?v=20261001b';
const stage=document.querySelector('#spatial-stage');let experience,progress=.77,free=false,night=false;
try{experience=await createSpatialExperience(stage);experience.update(progress,true);document.body.classList.add('ready')}
catch(error){console.error('Material study unavailable:',error);stage.classList.add('no-3d');document.body.classList.add('ready');document.querySelector('#load-status').textContent='写真で建築をご覧いただけます'}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{if(!experience)return;progress=Number(b.dataset.view);free=false;experience.setFree(false);experience.update(progress,true);document.querySelector('#free').setAttribute('aria-pressed','false');document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
document.querySelector('#free').addEventListener('click',()=>{if(!experience)return;free=!free;experience.setFree(free);document.querySelector('#free').setAttribute('aria-pressed',String(free))});
document.querySelector('#night').addEventListener('click',()=>{if(!experience)return;night=!night;experience.setNight(night);document.querySelector('#night').setAttribute('aria-pressed',String(night));document.querySelector('#night').textContent=night?'昼景':'夕景'});
addEventListener('resize',()=>experience?.resize());addEventListener('pagehide',()=>experience?.dispose());
</script></body></html>
